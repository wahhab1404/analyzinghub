app = "databento-live-svc"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  LOG_LEVEL = "INFO"
  UPDATE_INTERVAL_SECONDS = "1"
  HEARTBEAT_INTERVAL_SECONDS = "30"
  # Price the cash index via CME E-mini futures (GLBX.MDP3) outside RTH.
  # Set to "0" to disable and fall back to Polygon-only underlying pricing.
  ENABLE_FUTURES_UNDERLYING = "1"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[deploy]
  strategy = "rolling"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
