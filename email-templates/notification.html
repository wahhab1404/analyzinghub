<!DOCTYPE html>
<!--
  AnalyzingHub · قالب تنبيهات عام / Generic notification template
  استخدمه لإرسال تنبيهات مخصّصة عبر ZeptoMail أو أي مزوّد.
  استبدل العناصر النائبة التالية في الكود قبل الإرسال:
    {{TITLE_AR}}    عنوان التنبيه بالعربية
    {{TITLE_EN}}    Notification title in English
    {{BODY_AR}}     نص التنبيه بالعربية
    {{BODY_EN}}     Notification body in English
    {{CTA_URL}}     رابط الزر (اختياري)
    {{CTA_AR}}      نص الزر بالعربية (اختياري)
    {{CTA_EN}}      Button label in English (optional)
-->
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>AnalyzingHub</title>
  </head>
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Cairo',Tahoma,Arial,sans-serif;">
    <span style="display:none!important;visibility:hidden;opacity:0;height:0;width:0;overflow:hidden;">{{TITLE_AR}} · {{TITLE_EN}}</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,0.08);">
            <tr>
              <td style="background:linear-gradient(135deg,#2563EB 0%,#06B6D4 100%);padding:32px;text-align:center;">
                <a href="https://analyzhub.com" style="text-decoration:none;">
                  <img src="https://analyzhub.com/logo.png" alt="AnalyzingHub" height="40" style="height:40px;max-height:40px;margin-bottom:8px;display:inline-block;" />
                  <div style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:0.5px;">AnalyzingHub</div>
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">

                <!-- العربية -->
                <div dir="rtl" style="text-align:right;">
                  <h1 style="margin:0 0 12px;font-size:21px;font-weight:800;color:#0f172a;">{{TITLE_AR}}</h1>
                  <p style="margin:0 0 20px;font-size:15px;line-height:1.8;color:#475569;">{{BODY_AR}}</p>
                  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;">
                    <tr>
                      <td style="border-radius:10px;background:linear-gradient(135deg,#2563EB 0%,#06B6D4 100%);">
                        <a href="{{CTA_URL}}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">{{CTA_AR}}</a>
                      </td>
                    </tr>
                  </table>
                </div>

                <div style="height:1px;background:#e2e8f0;margin:28px 0;"></div>

                <!-- English -->
                <div dir="ltr" style="text-align:left;">
                  <h1 style="margin:0 0 12px;font-size:21px;font-weight:800;color:#0f172a;">{{TITLE_EN}}</h1>
                  <p style="margin:0 0 20px;font-size:15px;line-height:1.7;color:#475569;">{{BODY_EN}}</p>
                  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 8px;">
                    <tr>
                      <td style="border-radius:10px;background:linear-gradient(135deg,#2563EB 0%,#06B6D4 100%);">
                        <a href="{{CTA_URL}}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">{{CTA_EN}}</a>
                      </td>
                    </tr>
                  </table>
                </div>

              </td>
            </tr>
            <tr>
              <td style="background:#0f172a;padding:24px 32px;text-align:center;">
                <p style="margin:0 0 6px;font-size:13px;color:#cbd5e1;">AnalyzingHub</p>
                <p style="margin:0;font-size:12px;color:#64748b;">© 2026 AnalyzingHub · جميع الحقوق محفوظة · All rights reserved.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
